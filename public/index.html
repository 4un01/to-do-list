<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="icon" href="./images/to-do-listt.png">
    <link rel="stylesheet" href="./global.css">
    <link rel="stylesheet" href="./login.css">
</head>
<body>
    
    <div class="title">
        <h1>TODO APP</h1>
    </div>

    <div class="loginContainer">

        
        <h2 id="subtitle">Welcome back</h2>
        <p>Log in to your account</p>
        

        <div class="emailContainer">
            <label for="email">Email</label>
            <input type="email" name="email" id="email" placeholder="you@example.com" required>
        </div>

        <div class="psswrdContainer">
            <label for="password">Password</label>
            <input type="text" name="password" id="password" required>
        </div>

        <button id="loginBtn">Log in</button>

        <div class="changeToSignup">
            <p>Don't have an account?</p>
            <a href="" id="signupLink">Sign up</a>
        </div>
        
    </div>

    <div class="signupContainer">

        
        <h2 id="subtitle2">Create account</h2>
        <p>Sign up to get started</p>
        

        <div class="emailContainerSignup">
            <label for="signupEmail">Email</label>
            <input type="email" name="signupEmail" id="signupEmail" placeholder="you@example.com" required>
        </div>

        <div class="psswrdContainerSignup">
            <label for="signupPassword">Password</label>
            <input type="text" name="signupPassword" id="signupPassword" required>
        </div>

        <div class="confirmPsswrdContainer">
            <label for="confirmPassword">Confirm password</label>
            <input type="text" name="confirmPassword" id="confirmPassword">
        </div>

        <button id="signupBtn">Sign up</button>

        <div class="changeToLogin">
            <p>Already have an account?</p>
            <a href="" id="loginLink">Log in</a>
        </div>
        
    </div>

    <script src="./login.js"></script>
</body>
</html>
